# Paketler: ilgi testi (Brief 10). Gerçek ödeme yok, fiyat gösterilmiyor.
# Zorunlu bilgi asla ücretli değildir; pakette zaman kazandıran ve işi bizzat kolaylaştıran araçlar var.
# Hangi paketin öne çıkacağı cevaplara göre kodda seçilir (lib/araclar.ts paketOnerisi).
# Tüm tanıtımı kapatmak için lib/marka.ts PAKET_TANITIMI_AKTIF = false.

paketler:
  - id: beyanname
    ad: "Beyanname Paketi"
    aciklama: "Veraset beyannamesini kendiniz, kolayca verin."
    icerik:
      - "Resmi veraset ve intikal vergisi beyannamesini adım adım doldurma ve yazdırma"
      - "Her varlık için değerin nereden bulunacağı ve eklenecek belgeler"
      - "Mirasçı paylarına göre herkesin vergisi"
  - id: aile
    ad: "Aile Paketi"
    aciklama: "Borç riski, kalabalık aile ya da çok kurum varsa işleri tek elden yürütün."
    icerik:
      - "Beyanname Paketi'ndeki her şey"
      - "Mirası reddetmeli miyim? Varlık ve borç tablosu, kalan gün sayacı ve avukat için özet"
      - "Gideceğiniz her kurum için tek sayfa: ne götürülecek, gişede ne denecek, hangi dilekçe"

yakinda_metni: >
  Paketler çok yakında açılıyor. Şu an ödeme almıyoruz. Listeniz, son tarihler, hesaplayıcılar ve
  hak edebileceğiniz ödemeler her zaman ücretsiz kalacak.
eposta_yakinda_metni: "Paket açıldığında haber almak için e-posta bırakma seçeneği de çok yakında burada olacak."

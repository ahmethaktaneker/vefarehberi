# Paketler: ilgi testi. Gerçek ödeme yok, fiyat gösterilmiyor.
# Zorunlu bilgi asla ücretli değildir; pakette zaman kazandıran ve işi bizzat kolaylaştıran araçlar var.
# Her içerik maddesi bir araca bağlıdır. Satışta olmayan araçların sayfası gizli olsa da (lib/marka.ts
# GIZLI_SAYFALAR) paketlerde tanıtım için anlatılır. Öne çıkan paket cevaplara göre seçilir (lib/araclar.ts).
# Tüm tanıtımı kapatmak için lib/marka.ts PAKET_TANITIMI_AKTIF = false.

paketler:
  - id: beyanname
    ad: "Beyanname Paketi"
    aciklama: "Veraset beyannamesini kendiniz, kolayca verin."
    icerik:
      - { arac: beyanname_araci, metin: "Resmi veraset ve intikal vergisi beyannamesini adım adım doldurma ve yazdırma" }
      - { arac: beyanname_araci, metin: "Her varlık için değerin nereden bulunacağı ve eklenecek belgeler" }
      - { arac: beyanname_araci, metin: "Mirasçı paylarına göre herkesin vergisi" }
  - id: aile
    ad: "Aile Paketi"
    aciklama: "Aile kalabalıksa ya da gidilecek kurum çoksa işleri tek elden yürütün."
    icerik:
      - { arac: beyanname_araci, metin: "Beyanname Paketi'ndeki her şey" }
      - { arac: kurum_ziyaret, metin: "Gideceğiniz her kurum için tek sayfa: ne götürülecek, gişede ne denecek" }

yakinda_metni: >
  Paketler çok yakında açılıyor. Şu an ödeme almıyoruz. Listeniz, son tarihler, hesaplayıcılar ve
  hak edebileceğiniz ödemeler her zaman ücretsiz kalacak.
eposta_yakinda_metni: "Paket açıldığında haber almak için e-posta bırakma seçeneği de çok yakında burada olacak."

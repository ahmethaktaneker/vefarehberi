  ucretli_icerik: false

- id: kira_sozlesmesi
  baslik: "Kira sözleşmesine karar verin"
  kategori: borc_risk
  zaman_grubu: ilk_ay
  oncelik: normal
  kosul: { abonelikler: ["kira"] }
  ne: >
    Vefat eden kirada oturuyorsa sözleşme kendiliğinden bitmez; mirasçılara geçer. Evde kimse
    oturmayacaksa mirasçılar, yasal bildirim süresine uyarak en yakın fesih dönemi sonu için
    sözleşmeyi feshedebilir (Türk Borçlar Kanunu m.333). Evde kalacak biri varsa ev sahibiyle
    sözleşmeyi onun adına yenilemeyi konuşun.
  neden: >
    Sözleşme feshedilene kadar kira borcu işlemeye devam eder ve mirasçılardan istenebilir.
    Depozito da sözleşme bitince iade edilir.
  nereye: "Ev sahibi. Fesih bildirimini yazılı yapın (noter ya da iadeli taahhütlü mektup)."
  belgeler: [olum_belgesi, mirascilik_belgesi]
  ipuclari:
    - tur: genel
      metin: >
        Konut kiralarında yasal bildirim süresi 3 aydır; fesih dönemi sözleşmenin başlangıç tarihine
        göre hesaplanır (TBK m.328, 329). Sözleşmede daha uzun bir süre yazıyorsa o geçerlidir.
    - tur: genel
      metin: >
        Mirası reddetmeyi düşünüyorsanız, fesih ve ev boşaltma gibi işlemleri yapmadan önce bir
        avukata danışın; bazı davranışlar mirası kabul sayılabilir.
  kaynak: ["https://www.mevzuat.gov.tr/mevzuatmetin/1.5.6098.pdf"]
  yer: ev
  son_kontrol: "2026-09-29"
  dogrulandi: false
  ucretli_icerik: false

- id: abonelikler
  baslik: "Abonelikleri üzerinize almayı ya da kapatmayı değerlendirin"
  kategori: kurum
  zaman_grubu: ilk_ay
  oncelik: yuksek
  kosul: { abonelikler: ["elektrik", "su", "dogalgaz", "bilmiyorum"] }
  belirsizse: { abonelikler: "bilmiyorum" }
  ne: >
    Vefat eden kişinin üzerindeki elektrik, doğalgaz ve su aboneliklerini devralmayı ya da
    kapatmayı değerlendirin.
  neden: "Vefat edenin aboneliğini kullanmaya devam etmek, kurumlarca \"usulsüz kullanım\" sayılabiliyor."
  nereye: "İlgili elektrik, doğalgaz ve su kurumları. Aşağıdaki \"İlgili kurumlar\" bağlantılarına bakın."
  uyari: >
    Mirası reddetmeyi düşünüyorsanız güvence bedelini tahsil etmeden önce bir avukata danışın;
    vefat edenin alacaklarını almak mirası kabul sayılabilir (TMK m.610).
  belgeler: [mirascilik_belgesi]
  ipuclari:
    - tur: genel
      metin: >
        Aboneliği kapattıktan sonra yatırılmış güvence bedelini geri isteyin; birçok aile bu iadeden
        habersiz. Bazı kurumlar tüm mirasçıların onayını içeren muvafakatname istiyor. Örneğin
        Enerjisa, tutar 250 TL'yi aşıyorsa muvafakatnamenin noter onaylı olmasını istiyor.
    - tur: deneyim
      metin: "Kullanıcılar, kullanılmaya devam eden aboneliklerde hizmetin kesildiği ve usulsüz kullanım işlemi yapıldığı örnekler bildiriyor."
  kaynak:
    - "https://www.sikayetvar.com/baskent-dogalgaz/vefat"
    - "https://www.sikayetvar.com/ck-bogazici-elektrik/vefat"
    - "https://inceleriz.com/forum/konular/olu-insan-ustune-acik-olan-elektrik-aboneligi.9662/"
    - "https://www.enerjisa.com.tr/tr/sikca-sorulan-sorular/guvence-bedeli-ve-teminat-mektubu/vefat-eden-sozlesme-sahibine-ait-guvence-bedeli-nasil-iade-ediliyor"
    - "https://www.ckbogazici.com.tr/tr/iletisim/sikca-sorulan-sorular"
  sablonlar: [abonelik_iptal]
  kurum_turleri: [enerji, dogalgaz, su]
  yer: kurumlar
  onceki: [mirascilik_belgesi]
  son_kontrol: "2026-09-28"
  dogrulandi: false
  ucretli_icerik: false


  kaynak:
    - "https://www.sgk.gov.tr/Content/Post/fd3822ec-1d90-49fb-bd98-09ba1560465a/Cenaze-Odenegi-2026-01-09-02-37-56"
    - "https://www.erdemvarol.com.tr/yakininiz-vefat-ettiginde-hukuki-haklariniz/"
  yer: sgk
  son_kontrol: "2026-09-28"
  dogrulandi: false
  ucretli_icerik: false


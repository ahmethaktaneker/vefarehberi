# Zaman grubu: İlk 3 ay (Brief 7). Avukat kontrolünden GEÇMEDİ.

- id: reddi_miras
  baslik: "Mirası reddetmeyi değerlendirin"
  kategori: borc_risk
  zaman_grubu: ilk_3_ay
  oncelik: kritik
  arac: reddi_miras_tablosu
  kosul:
    any:
      - { borc: ["evet", "bilmiyorum"] }
      - { varliklar: ["kredi", "kredi_karti"] }
  belirsizse: { borc: "bilmiyorum" }
  son_tarih:
    baslangic: vefat_tarihi
    sure: { parametre: reddi_miras_ay }
    not: "Süre, ölümü öğrendiğiniz tarihten başlar; burada vefat tarihinden hesaplandı."
    gecti_notu: >
      Süre geçmiş görünüyor. Borcun mal varlığını aştığı açıksa, süre geçtikten sonra da
      "hükmen red" yolu olabilir. Bir avukata danışmanız önerilir.
  ne: >
    Genel bilgi olarak: Vefat eden kişinin borçları mal varlığından fazlaysa, mirası reddetmek
    mirasçıyı bu borçlardan korur. Mirası reddetmek ölüm aylığını etkilemez.
  neden: "Süre kısadır (3 ay); kaçırılması sonradan sorun yaşatabilir."
  nereye: "Vefat edenin son yerleşim yerindeki Sulh Hukuk Mahkemesi"
  belgeler: [nufus_kaydi, olum_belgesi]
  uyari: >
    Borcun kapsamını bilmiyorsanız önce "Kredi ve borç risk raporu alın" adımına bakın. Karar
    vermeden önce bir avukata danışmanız önerilir.
  ipuclari:
    - tur: genel
      metin: >
        Sürenin başlangıcı: Yasal mirasçılar için süre, ölümü öğrendikleri tarihten başlar; mirasçı
        olduğunu daha sonra öğrendiğini ispat eden için o tarihten. Vasiyetle atanmış mirasçılar için
        tasarrufun kendilerine bildirildiği tarihten başlar.
    - tur: genel
      metin: "Yurtdışında yaşıyorsanız mirasın reddi vekaletle de yapılabilir."
    - tur: genel
      metin: >
        Karar sonrası: Reddi miras kararınızın birkaç onaylı kopyasını saklayın. Yıllar sonra eski
        borçlar için arandığınızda (banka, operatör, varlık şirketi) bu kararı sunmanız gerekebilir.
        İcra takibi gelirse itiraz süresini kaçırmayın.
    - tur: deneyim
      metin: "Kullanıcılar, reddi miras yaptıktan yıllar sonra bile eski borçlar için arandıklarını anlatıyor."
  kaynak:
    - "TMK m.605-606"
    - "https://av-saimincekas.com/kanun/turk-medeni-kanunu/madde-606-tmk/"
    - "https://www.ozdipi.av.tr/reddi-miras-nedir/"
    - "https://www.ozcanlarhukuk.com/mirasin-hukmen-reddi-davasi/"
    - "https://www.palmahukuk.com/reddi-miras-yapinca-borc-kime-kalir/"
    - "https://www.sikayetvar.com/avukat/miras"
  yer: noter_mahkeme
  son_kontrol: "2026-09-28"
  dogrulandi: false
  ucretli_icerik: false

- id: kidem_tazminati
  baslik: "Kıdem tazminatı ve işçilik alacakları"
  kategori: odeme
  zaman_grubu: ilk_3_ay
  oncelik: normal
  kosul: { calisma_durumu: ["calisiyordu", "bilmiyorum"] }
  belirsizse: { calisma_durumu: "bilmiyorum" }
  ne: >
    Genel bilgi olarak: Çalışırken vefat eden ve en az 1 yıl kıdemi olan kişinin kıdem
    tazminatı, mirasçılık belgesindeki paylara göre mirasçılara ödenir.
  nereye: "Vefat edenin işvereni"
  belgeler: [mirascilik_belgesi]
  kaynak: ["https://yenisokegazetesi.com/haber/28110901/parayi-almayan-binlerce-kisi-var-vefat-sonrasi-devlet-tam-26369-tl-oduyor"]
  yer: isveren
  onceki: [mirascilik_belgesi]
  son_kontrol: "2026-09-28"
  dogrulandi: false
  ucretli_icerik: false

# Zaman grubu: İlk hafta. Avukat kontrolünden GEÇMEDİ.

- id: olum_belgesi
  baslik: "Ölüm belgesini alın"
  kategori: resmi
  zaman_grubu: ilk_hafta
  oncelik: yuksek
  kosul: { vefat_yeri: "turkiye" }
  ne: >
    Ölüm belgesi, diğer işlemlerin temelidir. Sağlık kurumunda gerçekleşen vefatlarda belgeyi
    kurum düzenler. Sağlık kurumu dışında (ör. evde) gerçekleşen vefatlarda belediye tabibi,
    yoksa toplum sağlığı merkezi hekimi, o da yoksa aile hekimi düzenler. Ölümü nüfus müdürlüğüne
    halk sağlığı müdürlüğü 10 gün içinde elektronik ortamda bildirir; ailenin ayrıca bildirim yapması
    gerekmez. Ölü muayenesi sırasında vefat edenin kimlik kartı istenebilir.
  neden: "Sonraki işlemlerin çoğu bu belgeye dayanır."
  nereye: "Sağlık kurumu; kurum dışındaki vefatlarda belediye tabibi, toplum sağlığı merkezi veya aile hekimi"
  kaynak: ["https://www.nvi.gov.tr/olum-islemleri"]
  yer: saglik
  sonuc_belge: olum_belgesi
  son_kontrol: "2026-09-28"
  dogrulandi: false
  ucretli_icerik: false

- id: yurtdisi_olum_bildirimi
  baslik: "Ölümü Türk dış temsilciliğine bildirin"
  kategori: resmi
  zaman_grubu: ilk_hafta
  oncelik: yuksek
  kosul: { vefat_yeri: "yurtdisi" }
  ne: >
    Yurtdışında vefat eden Türk vatandaşlarının ölümü, yerel makamlardan alınan belgelerle
    Türk dış temsilciliğine (konsolosluk veya büyükelçilik) bildirilir ve tescil edilir.
  neden: "Ölüm Türkiye'deki nüfus kayıtlarına bu bildirimle işlenir; sonraki işlemler bu kayda dayanır."
  nereye: "Ölümün gerçekleştiği yerden sorumlu Türk konsolosluğu veya büyükelçiliği"
  cevrimici: "Başvuru adımları ve randevu için Dışişleri Bakanlığı'nın konsolosluk sitesine bakabilirsiniz."
  baglantilar:
    - { ad: "Konsolosluk: Ölüm tescili ve cenaze nakli", url: "https://www.konsolosluk.gov.tr/Procedure/ShowProcedure/8" }
  ipuclari:
    - tur: genel
      metin: >
        Cenaze Türkiye'ye getirilecekse Türk dış temsilciliğinden cenaze nakil belgesi alınır.
        Hangi temsilciliğe başvurulacağı ülkeye göre değişebildiği için önce en yakın Türk
        temsilciliğine veya Konsolosluk Çağrı Merkezi'ne sorun.
    - tur: genel
      metin: >
        Ölüm temsilcilik aracılığıyla bildirilmemişse, yabancı makamlardan alınan belgenin Türkçe
        tercümesiyle ilçe nüfus müdürlüğüne başvurularak da tescil yaptırılabilir.
  kaynak:
    - "https://www.nvi.gov.tr/olum-islemleri"
    - "https://www.konsolosluk.gov.tr/Procedure/ShowProcedure/8"
  yer: konsolosluk
  son_kontrol: "2026-09-28"
  dogrulandi: false
  ucretli_icerik: false

- id: hesaptan_para_cekmeyin
  baslik: "Vefat edenin hesabından para çekmeyin"
  kategori: borc_risk
  zaman_grubu: ilk_hafta
  oncelik: kritik
  kosul:
    any:
      - { varliklar: ["banka", "bilmiyorum"] }
      - { calisma_durumu: "emekli" }
  ne: >
    Vefattan sonra hesaba yatan emekli maaşı gibi ödemeler, iade edilmesi
    gereken tutarlar olabilir. Mirasçılardan birinin vefat edenin hesabından kendi başına para
    çekmesi, diğer mirasçılar açısından hukuki sorun doğurabilir.
  neden: "Sonradan iade talebiyle ya da mirasçılar arasında anlaşmazlıkla karşılaşmamak için."
  uyari: >
    Vefat edenin kartıyla ya da şifresiyle işlem yapmayın. Hesaptaki parayı kendiniz için kullanmak
    ya da vefat edenin mallarını satmak, mirası kabul sayılabilir (TMK m.610); mirası reddetmeyi
    düşünüyorsanız bu işlemlerden özellikle kaçının.
  kaynak:
    - "https://www.gecmezhukuk.com/vefat-edenin-banka-hesabindan-para-cekilmesi/"
    - "https://www.sikayetvar.com/sgk/maas/vefat"
  kurum_turleri: [banka]
  yer: dikkat
  son_kontrol: "2026-09-28"
  dogrulandi: false
  ucretli_icerik: false

- id: hesap_ve_abonelikleri_not_alin
  baslik: "Hangi hesap ve abonelikler olduğunu not alın"
  kategori: belge
  zaman_grubu: ilk_hafta
  oncelik: normal
  kosul:
    any:
      - { varliklar: "bilmiyorum" }
      - { abonelikler: "bilmiyorum" }
  belirsizse:
    any:
      - { varliklar: "bilmiyorum" }
      - { abonelikler: "bilmiyorum" }
  ne: >
    Hangi banka hesaplarının ve aboneliklerin olduğunu bilmiyorsanız, önce bunları bir listede
    toplamak sonraki adımları kolaylaştırır.
  ipuclari:
    - tur: genel
      metin: "Mirasçı olarak yapabileceğiniz resmi sorgulamalar \"Banka hesaplarını bulun\" ve \"Taşınmazları bulun\" adımlarındadır."
  kaynak: ["https://www.turkiye.gov.tr/varis-hizmetleri"]
  yer: ev
  son_kontrol: "2026-09-28"
  dogrulandi: false
  ucretli_icerik: false

# Kurum rehberi: elektrik, doğalgaz, su (Brief 8).
# İstanbul, Ankara, İzmir'deki şirketler tek tek; diğer iller için tür başına bir "genel bilgi" kartı.
# Kullanıcıya hangi kurumun kendisine ait olduğu sorulmaz; faturada yazar.
# Elektrikte abonelik (sözleşme) görevli tedarik şirketiyle yapılır; dağıtım şirketi (BEDAŞ, AYEDAŞ,
# Başkent EDAŞ, Gediz EDAŞ) sayaç ve kesme/açma işini yapar.
# Birçok kurumun sitesinde vefat durumuna özel ayrıntı bulunamadı (28-29.09.2026); proje sahibi
# kurumlardan ve uzmanlardan bilgi topluyor (bkz. content/KURUM_ARASTIRMASI.md).

# ---------- Elektrik ----------

- id: ck_bogazici
  ad: "CK Boğaziçi Elektrik"
  bolge: "İstanbul Avrupa Yakası"
  tur: enerji
  web: "https://www.ckbogazici.com.tr/tr/iletisim/sikca-sorulan-sorular"
  iletisim: "Çağrı merkezi: 444 6 255"
  kosul: { abonelikler: ["elektrik", "bilmiyorum"] }
  islemler:
    - tip: iptal
      kanal: ["Müşteri Hizmet Merkezleri (MÜHİM)", "Çağrı merkezi", "Online işlem merkezi", "İletişim formu"]
      belgeler: [mirascilik_belgesi]
      notlar_resmi:
        - "Vefat etmiş kişi adına olan abonelik, mirasçılık belgesinde yer alan mirasçılar tarafından iptal edilebilir."
      notlar_deneyim:
        - "Vefat edenin aboneliğini kullanmaya devam edenlere usulsüz kullanım bildirimi geldiği örnekler anlatılıyor."
  guvence_bedeli_iadesi:
    - "Güvence bedeli iadesini mirasçılar veya tüm mirasçıları vekâleten temsil eden kişi talep edebilir."
    - "Tutar, sitedeki \"Güvence Bedeli Sorgulama\" ekranından öğrenilebilir. İade PTT şubelerinden de alınabilir; masrafı talep edene aittir."
  usulsuz_kullanim_uyarisi: true
  kaynak:
    - "https://www.ckbogazici.com.tr/tr/iletisim/sikca-sorulan-sorular"
    - "https://www.sikayetvar.com/ck-bogazici-elektrik/vefat"
  son_kontrol: "2026-09-28"
  dogrulandi: false

- id: enerjisa
  ad: "Enerjisa"
  bolge: "İstanbul Anadolu Yakası ve Ankara"
  tur: enerji
  web: "https://www.enerjisa.com.tr/tr/sikca-sorulan-sorular/guvence-bedeli-ve-teminat-mektubu/vefat-eden-sozlesme-sahibine-ait-guvence-bedeli-nasil-iade-ediliyor"
  iletisim: "Çağrı merkezi: 444 4 372"
  kosul: { abonelikler: ["elektrik", "bilmiyorum"] }
  islemler:
    - tip: genel
      kanal: ["Enerjisa hizmet noktaları", "Enerjisa Mobil", "Online işlemler", "Çağrı merkezi (randevu için)"]
      belgeler: [mirascilik_belgesi, muvafakatname]
  guvence_bedeli_iadesi:
    - "Tahliye (aboneliğin sonlandırılması) tamamlandıktan sonra mirasçılık belgesi ve tüm mirasçıların onayını içeren muvafakatname ile hizmet noktalarına başvurulur."
    - "Tutar 250 TL'yi aşıyorsa muvafakatnamenin noter onaylı olması gerekir."
  usulsuz_kullanim_uyarisi: false
  kaynak: ["https://www.enerjisa.com.tr/tr/sikca-sorulan-sorular/guvence-bedeli-ve-teminat-mektubu/vefat-eden-sozlesme-sahibine-ait-guvence-bedeli-nasil-iade-ediliyor"]
  son_kontrol: "2026-09-28"
  dogrulandi: false

- id: gdz_elektrik
  ad: "GDZ Elektrik (Gediz)"
  bolge: "İzmir ve Manisa"
  tur: enerji
  web: "https://www.gdzelektrik.com.tr/bilgi-merkezi/sikca-sorulan-sorular"
  kosul: { abonelikler: ["elektrik", "bilmiyorum"] }
  islemler:
    - tip: genel
      belgeler: [olum_belgesi, mirascilik_belgesi]
      notlar_deneyim:
        - "Güvence bedeli iadesinin geciktiğini anlatan kullanıcı şikâyetleri var; başvuru tarihini ve evrak numarasını not edin."
  usulsuz_kullanim_uyarisi: false
  kaynak:
    - "https://www.gdzelektrik.com.tr/bilgi-merkezi/sikca-sorulan-sorular"
    - "https://www.sikayetvar.com/gediz-elektrik-perakende/abonelik-iptali/guvence-bedeli"
  son_kontrol: "2026-09-29"
  dogrulandi: false

- id: genel_elektrik
  ad: "Diğer illerdeki elektrik şirketleri"
  bolge: "Faturanızda adı yazan şirket"
  tur: enerji
  genel: true
  kosul: { abonelikler: ["elektrik", "bilmiyorum"] }
  islemler:
    - tip: genel
      belgeler: [olum_belgesi, mirascilik_belgesi, kimlik]
      notlar_resmi:
        - "Abonelik, faturada adı yazan tedarik şirketiyle yapılır. Aboneliği kapatmak veya üzerinize almak için oraya başvurursunuz."
        - "Mirasçılar aboneliği sonlandırabilir ya da içlerinden biri adına yeni abonelik açtırabilir. Diğer mirasçıların onayı (muvafakatname) istenebilir."
        - "Güvence bedeli, abonelik kapanıp son fatura düşüldükten sonra mirasçılara payları oranında iade edilir."
  usulsuz_kullanim_uyarisi: true
  kaynak:
    - "https://www.enerjisa.com.tr/tr/sikca-sorulan-sorular/guvence-bedeli-ve-teminat-mektubu/vefat-eden-sozlesme-sahibine-ait-guvence-bedeli-nasil-iade-ediliyor"
    - "https://www.ckbogazici.com.tr/tr/iletisim/sikca-sorulan-sorular"
  son_kontrol: "2026-09-29"
  dogrulandi: false


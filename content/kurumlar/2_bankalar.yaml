# Kurum rehberi: bankalar (Brief 8).
# Bankaların sitelerinde vefat/miras işlemlerine dair ayrıntılı resmi sayfa bulunamadı (28.09.2026).
# Genel bilgi kanundan (VİVK) alınmıştır; banka bazlı notlar kullanıcı deneyimidir.

- id: tum_bankalar
  ad: "Tüm bankalar (genel bilgi)"
  tur: banka
  kosul: { varliklar: ["banka", "kredi", "kredi_karti", "bilmiyorum"] }
  islemler:
    - tip: genel
      kanal: ["Hesabın bulunduğu banka şubesi"]
      belgeler: [mirascilik_belgesi, kimlik]
      notlar_resmi:
        - "Hangi bankalarda hesap olduğunu e-Devlet'ten öğrenirsiniz; bakiye ve borç bilgisini bankaya mirasçılık belgesi ve kimliğinizle giderek alırsınız. Bunun için ilişik kesme belgesi gerekmez."
        - "Parayı çekmek için ise ayrıca vergi dairesinden ilişik kesme belgesi istenir; bu belge beyanname verilip vergi ödendikten sonra alınır. Kanuna göre bankalar, mirasçılara para ödemeden önce veraset ve intikal vergisinin ödendiğini gösteren belge ister. Bu belge sunulmazsa, veraset yoluyla intikallerde ödemeden %5 vergi karşılığı kesinti yapıp kalanı ödeyebilir (Veraset ve İntikal Vergisi Kanunu m.17)."
        - "Vefat edenin bankada kiralık kasası varsa, kasa vergi dairesinin yetkili bir memuru hazır bulunmadan açılamaz ve içindekiler mirasçılara verilemez (Veraset ve İntikal Vergisi Kanunu m.23)."
  edevlet:
    - { ad: "Mirasçı adına banka hesabı sorgulama", url: "https://www.turkiye.gov.tr/bdvd-murise-ait-mevduat-katilim-fonu-hesabi-bulunan-banka-sorgulama" }
    - { ad: "Mirasçı adına hayat sigortası sorgulama", url: "https://www.turkiye.gov.tr/sbvgm-hayat-sigortasi-police-ve-tazminat-bilgileri-sorgulama-mirascisi-oldugunuz-kisi-adina" }
  usulsuz_kullanim_uyarisi: false
  kaynak: ["https://www.mevzuat.gov.tr/mevzuatmetin/1.3.7338.pdf"]
  son_kontrol: "2026-09-28"
  dogrulandi: false

- id: vakifbank
  ad: "VakıfBank"
  tur: banka
  web: "https://www.vakifbank.com.tr"
  kosul: { varliklar: ["banka", "kredi", "kredi_karti", "bilmiyorum"] }
  islemler:
    - tip: genel
      notlar_deneyim:
        - "Kullanıcılar, aynı bankada kredi hayat sigortası konusunda ailelere farklı bilgi verildiğini anlatıyor. Sigortayı e-Devlet ve SBM üzerinden kendiniz de sorgulayın."
        - "Küçük ek hesap borçlarının mirasçılara haber verilmeden avukatlık bürosuna devredildiğini anlatan bir kullanıcı var."
  usulsuz_kullanim_uyarisi: false
  kaynak:
    - "https://www.sikayetvar.com/vakifbank/sube/miras"
    - "https://www.sikayetvar.com/hayat-sigortasi/vefat"
  son_kontrol: "2026-09-28"
  dogrulandi: false

- id: enpara
  ad: "Enpara"
  tur: banka
  web: "https://www.enpara.com"
  kosul: { varliklar: ["banka", "kredi", "kredi_karti", "bilmiyorum"] }
  islemler:
    - tip: genel
      notlar_deneyim:
        - "Kullanıcılar, diğer bankalardan farklı olarak kendi formatında ek bir noter belgesi istendiğini bildiriyor."
        - "Mirasçı olarak görünmeyen yakınlara bilgi verilmeyebiliyor."
  usulsuz_kullanim_uyarisi: false
  kaynak: ["https://www.sikayetvar.com/enpara/enparada-altin-mirasi-islemlerinde-gereksiz-noter-ucreti"]
  son_kontrol: "2026-09-28"
  dogrulandi: false
